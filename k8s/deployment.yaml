apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-context-service
  namespace: ai-alert
  labels:
    app: k8s-context-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-context-service
  template:
    metadata:
      labels:
        app: k8s-context-service
    spec:
      serviceAccountName: k8s-context-reader
      containers:
        - name: k8s-context-service
          image: k8s-context-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
