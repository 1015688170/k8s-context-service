apiVersion: v1
kind: Namespace
metadata:
  name: ai-alert
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-context-reader
  namespace: ai-alert
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-context-reader
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-context-reader
subjects:
  - kind: ServiceAccount
    name: k8s-context-reader
    namespace: ai-alert
roleRef:
  kind: ClusterRole
  name: k8s-context-reader
  apiGroup: rbac.authorization.k8s.io
